name: Deploy Headless API to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Code to cPanel via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          source: ".,!.git,!.github,!.venv,!.pytest_cache"
          target: ${{ secrets.CPANEL_REMOTE_DIR }}
          overwrite: true

      - name: Update Dependencies & Graceful WSGI Reload
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            REMOTE_DIR="${{ secrets.CPANEL_REMOTE_DIR }}"
            VENV_DIR="/home1/seepocok/virtualenv/public_html/ytapi.pgwiz.qzz.io/3.13"
            
            # Ensure virtualenv exists
            if [ ! -d "$VENV_DIR" ]; then
              mkdir -p /home1/seepocok/virtualenv/public_html/ytapi.pgwiz.qzz.io
              /opt/alt/python313/bin/python3 -m venv "$VENV_DIR"
            fi
            
            # Install / update dependencies
            "$VENV_DIR/bin/pip" install --no-cache-dir -U -r "$REMOTE_DIR/req.txt" yt-dlp
            
            # Ensure runtime directories exist
            mkdir -p "$REMOTE_DIR/tmp" "$REMOTE_DIR/downloads"
            
            # LiteSpeed WSGI graceful reload trigger
            touch "$REMOTE_DIR/tmp/restart.txt"
            
            echo "✅ Successfully deployed Headless API to cPanel and reloaded LiteSpeed!"
